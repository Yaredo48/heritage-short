# Reproducibility check on a clean machine: validate the storyboard, compute the
# timeline from the committed narration, and run the offline test suite
# (fake models, real FFmpeg). No API keys are used or needed.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (FFmpeg with libass, Noto Sans)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
      - name: Python packages
        run: python -m pip install -r requirements.txt
      - name: Validate the storyboard
        run: make validate PY=python
      - name: Timeline from the committed narration
        run: make timing PY=python
      - name: Offline tests
        run: make test PY=python
